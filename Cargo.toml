[package]
name = "pincer"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.34", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
reqwest = { version = "0.11", features = ["stream", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
uuid = { version = "1.6", features = ["v4"] }
bytes = "1.5"
tokio-stream = "0.1"
tokio-util = "0.7.18"
trash = "5.2.2"
regex = "1.10"
percent-encoding = "2.3"
