name: Auto Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Pincer
        run: cargo build --release

      - name: Package Binary
        run: |
          cd target/release
          zip pincer-macos.zip pincer

      - name: Get Version
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          files: target/release/pincer-macos.zip
          body: |
            ## Pincer Engine Release v${{ env.VERSION }}
            Automated build for macOS.
            
            **Note**: Download the `.zip` file and extract it to get the `pincer` executable.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
