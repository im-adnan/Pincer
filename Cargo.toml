[package]
name = "pincer"
version = "1.0.0"
edition = "2021"
description = "A high-performance, multithreaded, zero-allocation concurrent download engine written in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Dia-codes/engine"
homepage = "https://github.com/Dia-codes/engine"
readme = "README.md"
keywords = ["downloader", "multithreaded", "http", "json-rpc", "high-performance"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
tokio = { version = "1.34", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
reqwest = { version = "0.11", features = ["stream", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
uuid = { version = "1.6", features = ["v4"] }
bytes = "1.5"
tokio-stream = "0.1"
tokio-util = "0.7.18"
trash = "5.2.2"
regex = "1.10"
percent-encoding = "2.3"
lexopt = "0.3"
async-trait = "0.1.89"
suppaftp = { version = "8.0.4", features = ["tokio"] }
url = "2.5.8"
russh = "0.61.2"
russh-sftp = "2.3.0"
quick-xml = "0.31"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
xattr = "1.3"
