name: Auto Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update Cargo.toml Version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i '' "s/version = \"1.0.0\"/version = \"$VERSION\"/" Cargo.toml

      - name: Build Pincer
        run: cargo build --release

      - name: Package Binary
        run: |
          cd target/release
          zip pincer-macos.zip pincer

      - name: Get Version and Compute Checksum
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          SHA256_SUM=$(shasum -a 256 target/release/pincer-macos.zip | awk '{print $1}')
          echo "SHA256_SUM=$SHA256_SUM" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          files: target/release/pincer-macos.zip
          body: |
            ## Pincer Engine Release v${{ env.VERSION }}
            Automated build for macOS (ARM64).
            
            **Note**: Download the `.zip` file and extract it to get the `pincer` executable.
            
            ### Homebrew Details
            **SHA256 Checksum (macOS):** `${{ env.SHA256_SUM }}`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
